# Traefik static config.
# TLS is a single *.${DOMAIN} wildcard from acme.sh, served as the default
# certificate (see dynamic.yml tls.stores). Traefik has no ACME resolver of its
# own and no Docker provider — routes come from the file provider only.

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
