name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate compose and Traefik config
    runs-on: ubuntu-latest
    env:
      DOMAIN: example.com
      CF_DNS_API_TOKEN: dummy
    steps:
      - uses: actions/checkout@v7

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Render dynamic.yml
        run: |
          envsubst '$DOMAIN' < traefik/dynamic.yml.template > traefik/dynamic.yml

      - name: Validate full merged compose config
        run: docker compose config >/dev/null

      - name: Validate each profile
        run: |
          for p in nextcloud vaultwarden gitea homarr kuma paperless media vpn assistant mqtt monitoring tunnel wireguard ddns; do
            echo "profile: $p"
            docker compose --profile "$p" config >/dev/null
          done

      - name: Validate rendered dynamic.yml is valid YAML
        run: |
          python3 -c 'import yaml,sys; yaml.safe_load(open("traefik/dynamic.yml")); print("dynamic.yml OK")'

  quadlet:
    name: Validate Quadlet units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install podman and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gettext-base

      - name: Check quadlet/ matches the compose files
        run: |
          cp -r quadlet /tmp/quadlet-committed
          python3 scripts/gen-quadlets.py
          if ! diff -r /tmp/quadlet-committed quadlet; then
            echo "::error::quadlet/ is stale - run 'just gen-quadlets' and commit"
            exit 1
          fi

      - name: Render units and validate with the real quadlet generator
        run: |
          cp .env.example .env
          mkdir -p /tmp/units
          # every profile, so no unit escapes validation
          ENV_FILE=.env UNIT_DIR=/tmp/units ./scripts/install-quadlets.sh \
            nextcloud vaultwarden gitea homarr kuma paperless media vpn \
            assistant mqtt monitoring tunnel wireguard ddns
          # The generator binary moves around between distros.
          quadlet=""
          for c in /usr/libexec/podman/quadlet /usr/lib/podman/quadlet \
                   /usr/lib/systemd/system-generators/podman-system-generator \
                   "$(command -v quadlet 2>/dev/null || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then quadlet="$c"; break; fi
          done
          if [ -z "$quadlet" ]; then
            echo "::error::could not locate the quadlet generator"
            exit 1
          fi
          echo "using $quadlet"
          # -dryrun exits non-zero when a unit is bad, and we want the log first.
          QUADLET_UNIT_DIRS=/tmp/units "$quadlet" -dryrun >/tmp/out.txt 2>/tmp/err.txt || true
          cat /tmp/err.txt
          if grep -qiE 'error|unsupported|invalid' /tmp/err.txt; then
            echo "::error::quadlet generator rejected a unit"
            exit 1
          fi
          count=$(grep -c '^---' /tmp/out.txt || true)
          if [ "${count:-0}" -lt 30 ]; then
            echo "::error::expected 30+ units, got ${count}"
            exit 1
          fi
          echo "generated ${count} units cleanly"

  env-coverage:
    name: Check .env.example coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run env-coverage check
        run: sh scripts/check-env-coverage.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint -c .yamllint compose.yml core.yml cloud.yml media.yml home.yml monitoring.yml traefik/*.yml .github/workflows/*.yml

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.jsonc

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
