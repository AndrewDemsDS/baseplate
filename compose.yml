# baseplate — single-host self-hosting stack
#
# The stack is split across include files by role. Enable apps with profiles:
#   docker compose --profile nextcloud --profile monitoring up -d
#
# Default ingress is LAN-only behind Traefik. For remote access, enable the
# `tunnel` (Cloudflare) or `wireguard` profile in core.yml.

name: baseplate

include:
  - core.yml        # traefik, acme.sh, socket-proxy, watchtower, config-render (+ tunnel/wireguard/ddns)
  - cloud.yml       # nextcloud, vaultwarden, gitea, homarr, uptime-kuma (+ paperless)
  - media.yml       # jellyfin, sonarr, radarr, prowlarr, bazarr, tdarr, qbittorrent (+ gluetun vpn)
  - home.yml        # home assistant, mosquitto
  - monitoring.yml  # beszel hub + agent, trivy vuln-scanner
